name: 백테스트 과거 주가 수집

on:
  push:
    branches: [claude/project-thread-lsq8ns]
    paths: [scripts/backtest/fetch_prices.py, .github/workflows/backtest-prices.yml]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/backtest/fetch_prices.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw/backtest/prices.json
          git commit -m "data: 백테스트용 과거 주가" && git push
