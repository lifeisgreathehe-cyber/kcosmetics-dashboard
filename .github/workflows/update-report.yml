name: 기업분석 리포트 재생성

on:
  schedule:
    - cron: "30 23,7,11 * * *"   # 매일 08:30·16:30·20:30 KST (뉴스·종가 반영 뒤)
  push:
    branches: [main]
    paths: ["config/report/**", "raw/report/**", "scripts/report/**"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-report
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 리포트 입력 파일 재생성 (네트워크 없이)
        run: python scripts/report/build.py
      - name: main 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/report/data
          if git diff --cached --quiet; then echo "변경 없음"; else
            git commit -m "data: 기업분석 리포트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
          fi
