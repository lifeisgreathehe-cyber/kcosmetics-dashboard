name: 시가총액 외부 대조

on:
  push:
    branches: ["claude/**"]
    paths: ["scripts/audit_market.py", ".github/workflows/audit-market.yml"]
  schedule:
    - cron: "30 7 * * 1-5"  # 평일 16:30 KST (종가 확정 후)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: audit-market
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 외부 시세·주식수 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/audit_market.py
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw/audit
          if git diff --cached --quiet; then echo "변경 없음"; else
            git commit -m "data: 시가총액 외부 대조 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
          fi
