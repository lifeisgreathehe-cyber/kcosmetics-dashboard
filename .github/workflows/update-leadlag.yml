name: 산업 데이터 선행·동행성 갱신

on:
  schedule:
    - cron: "20 8 * * *"  # 매일 17:20 KST (월봉 주가·KOSIS·관세청 갱신 뒤)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-leadlag
  cancel-in-progress: false

jobs:
  leadlag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 계산 (config/<업종>/leadlag.json 이 있는 업종)
        run: python scripts/leadlag.py --industry all
      - name: main 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*/data/leadlag.json docs/data/leadlag.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "변경 없음"; else
            git commit -m "data: 선행·동행성 $(TZ=Asia/Seoul date '+%Y-%m-%d')"
            for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
          fi
