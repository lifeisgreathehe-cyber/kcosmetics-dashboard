name: 실시간 주가 갱신

on:
  schedule:
    - cron: "*/10 0-6 * * 1-5"  # 평일 09:00~15:50 KST, 10분 간격 (GitHub 사정으로 몇 분 늦을 수 있음)
    - cron: "45 6 * * 1-5"      # 평일 15:45 KST 종가 확정 후 main에 반영
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-quotes
  cancel-in-progress: true

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 시세 수집
        run: |
          python scripts/update.py --only quotes
          python scripts/update.py --industry semi --only quotes
      - name: live-data 브랜치에 게시 (장중 실시간용)
        run: |
          mkdir -p /tmp/live/semi && cp docs/data/quotes.json docs/data/valuation.json /tmp/live/
          cp docs/semi/data/quotes.json docs/semi/data/valuation.json /tmp/live/semi/ || true
          cd /tmp/live
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "quotes $(date -u +%H:%M)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live-data
      - name: 종가 main 반영
        if: github.event.schedule == '45 6 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/quotes.json docs/data/valuation.json docs/data/meta.json && git add docs/semi/data || true
          if git diff --cached --quiet; then echo "변경 없음"; else
            git commit -m "data: 종가 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git pull --rebase -q && git push
          fi
